[adapter]
id = "proton-mail"
name = "Proton Mail"
description = "Index Proton Mail messages through Proton Mail Bridge or any IMAP-compatible bridge endpoint. Captures threads, messages, labels, and attachment metadata for archive search."
version = "0.1.0"
author = "spacedrive"
license = "MIT"
icon = "mail"
min_spacedrive = "0.1.0"
trust_tier = "external"

[adapter.runtime]
command = "python3 sync.py"
timeout = 900
schedule = "*/10 * * * *"
requires = ["python3 >= 3.9"]

[[adapter.config]]
key = "host"
name = "IMAP Host"
description = "Hostname or IP address for Proton Mail Bridge / IMAP endpoint"
type = "string"
required = true
default = "127.0.0.1"

[[adapter.config]]
key = "port"
name = "IMAP Port"
description = "IMAP port exposed by Proton Mail Bridge. Bridge commonly uses 1143 with STARTTLS."
type = "integer"
required = true
default = 1143

[[adapter.config]]
key = "username"
name = "Bridge Username"
description = "IMAP username from Proton Mail Bridge for the mailbox you want to archive"
type = "string"
required = true

[[adapter.config]]
key = "password"
name = "Bridge Password"
description = "IMAP password generated by Proton Mail Bridge"
type = "string"
required = true
secret = true

[[adapter.config]]
key = "mailboxes"
name = "Mailboxes"
description = "Comma-separated list of mailboxes to sync. Default is 'All Mail'. Use a single catch-all mailbox to avoid duplicate copies where possible."
type = "string"
required = false
default = "All Mail"

[[adapter.config]]
key = "tls_mode"
name = "TLS Mode"
description = "Connection security mode: starttls, ssl, or none. Proton Mail Bridge usually expects starttls."
type = "string"
required = false
default = "starttls"

[[adapter.config]]
key = "tls_verify"
name = "Verify TLS Certificate"
description = "Verify the IMAP TLS certificate. Disable this for Proton Mail Bridge's self-signed certificate unless you have installed and trust it."
type = "boolean"
required = false
default = false

[[adapter.config]]
key = "max_results"
name = "Max Messages per Sync"
description = "Maximum messages to fetch across all selected mailboxes per sync cycle. Use 0 for no limit."
type = "integer"
required = false
default = 500

[data_type]
id = "email"
name = "Email"
icon = "mail"

[models.thread]
fields.subject = "string"
fields.last_date = "datetime"
fields.message_count = "integer"
fields.snippet = "text"
has_many = ["message"]

[models.message]
fields.subject = "string"
fields.snippet = "text"
fields.body = "text"
fields.from = "string"
fields.to = "string"
fields.cc = "string"
fields.bcc = "string"
fields.date = "datetime"
fields.mailbox = "string"
fields.labels = "string"
fields.message_id = "string"
fields.in_reply_to = "string"
fields.references = "text"
fields.is_read = "boolean"
fields.is_flagged = "boolean"
fields.has_attachments = "boolean"
fields.size = "integer"

[models.message.relations]
belongs_to = ["thread"]
many_to_many = ["label"]

[models.label]
fields.name = "string"
fields.color = "string"
fields.type = "string"

[models.attachment]
fields.filename = "string"
fields.mime_type = "string"
fields.size = "integer"
fields.content_id = "string"
fields.is_inline = "boolean"

[models.attachment.relations]
belongs_to = ["message"]

[search]
primary_model = "message"
title = "subject"
preview = "body"
subtitle = "from"
search_fields = ["subject", "snippet", "body", "from", "to", "cc", "bcc", "labels", "mailbox"]
date_field = "date"
